<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="header-inner">

    <a href="index.html" class="logo">
      <img src="images/logo.webp">
      <span class="logo-text">R. V. Elektro</span>
    </a>

    <nav class="nav">
      <a href="index.html">Úvod</a>
      <a href="sluzby.html">Služby</a>
      <a href="galerie.html">Galerie</a>
      <a href="kontakt.html">Kontakt</a>
    </nav>

    <div class="hamburger" id="hamburger">☰</div>
    <button id="themeToggle" class="theme-btn">🌓</button>

  </div>
</header>

<section class="contact reveal">

  <h1>Kontakt</h1>

  <div class="contact-grid">

    <div class="contact-box">
      <h3>📍 Adresa</h3>
      <p>Tvoje ulice 123<br>738 01 Frýdek-Místek</p>
    </div>

    <div class="contact-box">
      <h3>📞 Telefon</h3>
      <p>+420 777 123 456</p>
    </div>

    <div class="contact-box">
      <h3>📧 Email</h3>
      <p>info@rvelektro.cz</p>
    </div>

    <div class="contact-box">
      <h3>🏢 Firma</h3>
      <p>R. V. Elektro</p>
      <p>IČ: 12345678</p>
    </div>

  </div>

  <div class="form-section">

    <h2>Kontaktní formulář</h2>

    <form class="contact-form">

      <input type="text" placeholder="Jméno" required>
      <input type="email" placeholder="Email" required>
      <input type="text" placeholder="Telefon">

      <textarea placeholder="Vaše zpráva..." rows="5" required></textarea>

      <button type="submit">Odeslat</button>

    </form>

  </div>

</section>

<script src="script.js"></script>
</body>
</html>
