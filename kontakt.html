<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kontakt na R. V. Elektro: telefon, email, adresa a kontaktní formulář.">
  <title>Kontakt | R. V. Elektro</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="kontakt.css">
</head>
<body>
<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo" aria-label="R. V. Elektro - úvod">
      <img src="images/logo-header-light-readable.png" alt="Logo R. V. Elektro">
      <span class="logo-text">R. V. Elektro</span>
    </a>

    <nav class="nav" id="mainNav" aria-label="Hlavní navigace">
      <a href="index.html">Úvod</a>
      <a href="sluzby.html">Služby</a>
      <a href="galerie.html">Galerie</a>
      <a class="active" href="kontakt.html">Kontakt</a>
    </nav>

    <div class="header-actions">
      <button id="themeToggle" class="icon-btn" type="button" aria-label="Přepnout tmavý režim">☾</button>
      <button id="hamburger" class="icon-btn hamburger" type="button" aria-label="Otevřít menu" aria-controls="mainNav" aria-expanded="false">☰</button>
    </div>
  </div>
</header>

<main>
  <section class="page-title reveal">
    <h1>Kontakt</h1>
    <p>Napiš nebo zavolej a domluvíme rozsah práce, termín i nejvhodnější postup.</p>
  </section>

  <section class="section contact-stack reveal" aria-label="Kontaktní údaje">
    <article class="card contact-box">
      <h2>Adresa</h2>
      <p>Tvoje ulice 123<br>738 01 Frýdek-Místek</p>
    </article>

    <article class="card contact-box">
      <h2>Telefon</h2>
      <p><a href="tel:+420777123456">+420 777 123 456</a></p>
    </article>

    <article class="card contact-box">
      <h2>Email</h2>
      <p><a href="mailto:info@rvelektro.cz">info@rvelektro.cz</a></p>
    </article>

    <article class="card contact-box">
      <h2>Firma</h2>
      <p>R. V. Elektro<br>IČ: 12345678</p>
    </article>
  </section>

  <div class="divider reveal"></div>

  <section class="section form-section reveal">
    <h2>Kontaktní formulář</h2>
    <form class="contact-form">
      <label>Jméno a příjmení
        <input type="text" name="name" autocomplete="name" required>
      </label>
      <label>Email
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label>Telefon
        <input type="tel" name="phone" autocomplete="tel">
      </label>
      <label>Zpráva
        <textarea name="message" rows="6" required></textarea>
      </label>
      <button type="submit">Odeslat zprávu</button>
      <p class="form-status" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>

<script src="script.js"></script>
<script src="kontakt.js"></script>
</body>
</html>
