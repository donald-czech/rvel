
<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt | R. V. Elektro</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="kontakt.css">
</head>

<body>

<header class="header">
  <div class="header-inner">

    <a href="index.html" class="logo">
      <img src="images/logo.webp">
      <span class="logo-text">R. V. Elektro</span>
    </a>

    <nav class="nav">
      <a href="index.html">Úvod</a>
      <a href="sluzby.html">Služby</a>
      <a href="galerie.html">Galerie</a>
      <a href="kontakt.html">Kontakt</a>
    </nav>

    <div class="hamburger" id="hamburger">☰</div>
    <button id="themeToggle" class="theme-btn">🌓</button>

  </div>
</header>

<!-- ================= TITLE ================= -->
<section class="page-title reveal">
  <h1>Kontakt</h1>
</section>

<!-- ================= BOXES ================= -->
<section class="contact-stack reveal">

  <div class="contact-box">
    <h3>📍 Adresa</h3>
    <p>Tvoje ulice 123<br>738 01 Frýdek-Místek</p>
  </div>

  <div class="contact-box">
    <h3>📞 Telefon</h3>
    <p><a href="tel:+420777123456">+420 777 123 456</a></p>
  </div>

  <div class="contact-box">
    <h3>📧 Email</h3>
    <p><a href="mailto:info@rvelektro.cz">info@rvelektro.cz</a></p>
  </div>

  <div class="contact-box">
    <h3>🏢 Firma</h3>
    <p>R. V. Elektro</p>
    <p>IČ: 12345678</p>
  </div>

</section>

<!-- ================= FORM ================= -->

<div class="divider reveal"></div>

<section class="form-title reveal">
  <h2>Kontaktní formulář</h2>
</section>

<section class="form-section reveal">

  <form class="contact-form">

    <input type="text" placeholder="Jméno a příjmení" required>
    <input type="email" placeholder="Email" required>
    <input type="text" placeholder="Telefon">

    <textarea placeholder="Zpráva..." rows="6" required></textarea>

    <button type="submit">Odeslat</button>

  </form>

</section>

<script src="script.js"></script>
<script src="kontakt.js"></script>
</body>
</html>
